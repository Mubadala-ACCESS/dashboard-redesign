<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title }} | {{ app_name }}</title>
    <meta name="description" content="Mubadala ACCESS environmental monitoring dashboard for Abu Dhabi." />
    <meta name="theme-color" content="#5b1f8a" />
    <link rel="icon" href="/static/img/favicon.ico" sizes="any" />
    <link rel="shortcut icon" href="/static/img/favicon.ico" />
    <link rel="apple-touch-icon" href="/static/img/favicon.png" />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="preconnect" href="https://cdn.plot.ly" crossorigin />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="/static/css/main.css?v=station-iot-sensors-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Go to homepage">
          <img src="/static/img/maccess-logo.png" alt="Mubadala ACCESS Center logo" class="brand-logo" />
          <span class="sr-only">{{ app_name }}</span>
        </a>
        <nav class="topnav" aria-label="Primary navigation">
          <a href="/" class="{% if request.url.path == '/' %}is-active{% endif %}">Map</a>
          <a href="/get-started" class="{% if request.url.path == '/get-started' or request.url.path == '/glossary' or request.url.path == '/support' %}is-active{% endif %}">Get Started</a>
          <a href="/status" class="{% if request.url.path == '/status' or request.url.path == '/alerts' %}is-active{% endif %}">Status</a>
        </nav>
      </header>
      {% block content %}{% endblock %}
    </div>

    <dialog id="global-modal" class="modal-shell"></dialog>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
